<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
  </defs>
  <!-- Obsidian Squircle Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <!-- Elegant perimeter border for sharp definition across both light & dark browser tabs -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2"/>
  <!-- Razor-sharp iconic pulse mark -->
  <polyline points="13.2,43.5 26.8,29.8 35.2,38.2 51.2,19.8" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="4.8" 
            stroke-linecap="butt" 
            stroke-linejoin="miter" 
            stroke-miterlimit="5" />
</svg>
